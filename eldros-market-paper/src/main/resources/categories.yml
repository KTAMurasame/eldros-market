# Categories of the market list and the catalog. Applies after /marketadmin reload.
# items: item ids; * means "any characters" (e.g. "*_ore" = every ore). Ids without a namespace mean minecraft:.
# The FIRST category (top to bottom) that matches an item gets it; items nothing matches are under "Other".
# name: per language file (en_US is the fallback); MiniMessage colours allowed. icon: any item id.
# The ids "all" and "other" are reserved.
categories:
  minerals:
    icon: DIAMOND
    name: {en_US: "Ores & minerals", tr_TR: "Maden ve mineraller"}
    items: ["*_ore", "raw_*", "*_ingot", "*_nugget", "diamond", "emerald", "coal", "charcoal", "lapis_lazuli", "redstone",
            "quartz", "amethyst_shard", "netherite_scrap", "ancient_debris", "flint", "glowstone_dust",
