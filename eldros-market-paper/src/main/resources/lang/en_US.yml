# Eldros Market — English. MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Placeholders in <angle brackets> are filled by the plugin. Player-provided text (item names) is never parsed as tags.
lang-version: 1
language-name: "English"

prefix: "<dark_gray>[<gold>Market</gold>]</dark_gray> "

format:
  decimal-separator: "."
  grouping-separator: ","
  money: "<gold><amount></gold>"

general:
  player-only: "<red>Only players can do that.</red>"
  no-permission: "<red>You do not have permission to do that.</red>"
  safe-mode: "<red>The market is paused for maintenance. Your money and items are safe. Please try again later.</red>"
  error: "<red>Something went wrong. Nothing was charged. Please tell an admin if it happens again.</red>"
  unknown-subcommand: "<red>Unknown command. Use <yellow>/market help</yellow>.</red>"
  loading: "<gray>Loading…</gray>"
  busy: "<yellow>The market is busy right now. Please try again in a moment.</yellow>"

help:
  - "<gold>Eldros Market</gold>"
  - "<yellow>/market</yellow> <gray>— open the market</gray>"
  - "<yellow>/market sell <qty> <price></yellow> <gray>— sell the item in your hand</gray>"
  - "<yellow>/market buy <qty> <price> [item]</yellow> <gray>— buy the item in your hand, or a named item</gray>"
  - "<yellow>/market orders</yellow> <gray>— your active orders</gray>"
  - "<yellow>/market cancel <id></yellow> <gray>— cancel one of your orders</gray>"
  - "<yellow>/market mailbox</yellow> <gray>— items and money waiting for you</gray>"
  - "<yellow>/market claim [all]</yellow> <gray>— collect from your mailbox</gray>"
  - "<yellow>/market lang <en_US|tr_TR></yellow> <gray>— change your language</gray>"

validation:
  empty: "<red>Please enter a value.</red>"
  not_a_number: "<red>Use plain numbers like <yellow>12</yellow> or <yellow>12.50</yellow>.</red>"
  negative: "<red>The value cannot be negative.</red>"
  too_many_decimals: "<red>Too many decimal places.</red>"
  too_large: "<red>That number is too large.</red>"
  quantity_invalid: "<red>The quantity must be at least 1.</red>"
  quantity_too_large: "<red>At most <yellow><max></yellow> items per order.</red>"
  price_too_low: "<red>The price per item must be at least <min>.</red>"
  price_too_high: "<red>The price per item can be at most <max>.</red>"
  total_overflow: "<red>That order is too large.</red>"
  too_many_orders: "<red>You already have the maximum of <yellow><max></yellow> active orders.</red>"

item:
  hold-item: "<red>Hold the item you want to trade in your main hand.</red>"
  unknown: "<red>Unknown item <yellow><name></yellow>.</red>"
  blocked: "<red>This item cannot be traded on the market.</red>"
  filled-container: "<red>Empty the container first; filled containers cannot be traded.</red>"

reason:
  insufficient_funds: "<red>You do not have enough money for this order.</red>"
  not_enough_items: "<red>You do not have that many of this item.</red>"
  inventory_full: "<red>Your inventory is full. Make some room and try again.</red>"
  not_available: "<red>That is no longer available.</red>"
  not_owner: "<red>That is not your order.</red>"
  safe_mode: "<red>The market is paused for maintenance. Your money and items are safe.</red>"
  quarantined: "<yellow>We could not confirm the payment result. An admin will review it — nothing will be charged twice.</yellow>"

order:
  created-buy: "<green>Buy order placed:</green> <yellow><qty>×</yellow> <item> at <price> each (reserved <total>)."
  created-sell: "<green>Sell order placed:</green> <yellow><qty>×</yellow> <item> at <price> each."
  filled-now: "<green><filled> of <qty> matched immediately.</green> Check <yellow>/market mailbox</yellow>."
  cancelled: "<green>Order #<id> cancelled.</green> The rest went to your mailbox."
  self-cross: "<gray>Note: your own orders never match each other.</gray>"

orders:
  header: "<gold>Your active orders</gold>"
  empty: "<gray>You have no active orders.</gray>"
  entry: "<gray>#<id></gray> <side> <yellow><remaining>/<qty>×</yellow> <item> <gray>@</gray> <price>"
  side-buy: "<aqua>BUY</aqua>"
  side-sell: "<light_purple>SELL</light_purple>"

mailbox:
  header: "<gold>Your mailbox</gold>"
  empty: "<gray>Your mailbox is empty.</gray>"
  entry-money: "<gray>#<id></gray> <amount> <gray>(<reason>)</gray>"
  entry-item: "<gray>#<id></gray> <yellow><qty>×</yellow> <item> <gray>(<reason>)</gray>"
  waiting: "<yellow>You have <count> item(s) waiting in your mailbox.</yellow> <gray>/market mailbox</gray>"
  reasons:
    TRADE_ITEM: "bought"
    TRADE_MONEY: "sold"
    PRICE_IMPROVEMENT: "cheaper than your bid"
    CANCEL_REFUND: "cancelled order"
    EXPIRE_REFUND: "expired order"
    RECOVERY_REFUND: "recovered after a restart"
    RESOLVED_REFUND: "resolved by an admin"

claim:
  money: "<green>Collected <amount>.</green>"
  items: "<green>Collected <yellow><qty>×</yellow> <item>.</green>"
  partial: "<yellow>Only <qty> fit in your inventory; the rest stays in your mailbox.</yellow>"
  nothing: "<gray>Nothing to collect.</gray>"

lang:
  set: "<green>Language set to <name>.</green>"
  unknown: "<red>Unknown language. Available: <list></red>"

notify:
  trade:
    sold: "<green>Sold <yellow><qty>×</yellow> <item> for <price> each.</green> <gray>/market mailbox</gray>"
    bought: "<green>Bought <yellow><qty>×</yellow> <item> for <price> each.</green> <gray>/market mailbox</gray>"
  order:
    cancelled: "<gray>Your order for <item> was cancelled; <qty> returned to your mailbox.</gray>"
    expired: "<yellow>Your order for <item> expired; the rest is in your mailbox.</yellow>"
  recovery:
    refund: "<yellow>After a server restart, <amount> was returned to your mailbox.</yellow>"
    items: "<yellow>After a server restart, <qty>× <item> were returned to your mailbox.</yellow>"
    review: "<yellow>An unfinished market action is being reviewed by an admin. Nothing will be charged twice.</yellow>"

admin:
  reloaded: "<green>Configuration and languages reloaded.</green>"
  reload-failed: "<red>Reload failed; the previous settings stay active: <error></red>"
  verify-ok: "<green>All market invariants hold.</green>"
  verify-fail: "<red><count> problem(s):</red>"
  verify-line: "<red>- <line></red>"
  safemode-on: "<yellow>Safe mode ON: new operations are refused.</yellow>"
  safemode-off: "<green>Safe mode OFF: market reloaded and recovered.</green>"
  safemode-still: "<red>The database still refuses writes; safe mode stays on.</red>"
  safemode-status: "<gray>Safe mode: <state></gray>"
  recovery-header: "<gold>Quarantined operations</gold>"
  recovery-none: "<green>No quarantined operations.</green>"
  recovery-entry: "<gray><op></gray> <yellow><type></yellow> <player> <amount> <gray>(<reason>)</gray>"
  resolved: "<green>Resolved <op> as <decision>.</green>"
  resolve-failed: "<red>Could not resolve: <error></red>"
  orphan-markers: "<red>Player <player> carries <count> marker(s) with no journal entry: <list>. Check backups before removing.</red>"
  usage: "<gray>/marketadmin reload | verify | safemode [on|off] | recovery list | recovery resolve <op> <applied|not-applied> [qty]</gray>"

# --- menus (layouts are in menus/*.yml) ----------------------------------------------------------------
menu:
  prompt:
    search: "<yellow>Type the item's English id in chat, e.g. <white>diamond</white> or <white>oak log</white></yellow> <gray>(or <white>cancel</white>).</gray>"
    quantity: "<yellow>Type the quantity in chat</yellow> <gray>(or <white>cancel</white>).</gray>"
    price: "<yellow>Type the unit price in chat, e.g. 12.50</yellow> <gray>(or <white>cancel</white>).</gray>"
  common:
    none: "<gray>none</gray>"
    back: {name: "<yellow>Back</yellow>"}
    close: {name: "<red>Close</red>"}
    refresh: {name: "<yellow>Refresh</yellow>"}
    previous: {name: "<yellow>Previous page</yellow>", lore: ["<gray>Page <page>/<pages></gray>"]}
    next: {name: "<yellow>Next page</yellow>", lore: ["<gray>Page <page>/<pages></gray>"]}
    loading: {name: "<gray>Loading…</gray>"}
    empty: {name: "<gray>Nothing here yet.</gray>"}
    search: {name: "<yellow>Search</yellow>", lore: ["<gray>Current: <white><search></white></gray>", "<gray>Click and type an English item id in chat.</gray>"]}
    clear-search: {name: "<yellow>Clear search</yellow>"}
  main:
    title: "<dark_gray>Eldros Market</dark_gray>"
    browse: {name: "<gold>Browse the market</gold>", lore: ["<gray>Items with open buy and sell orders.</gray>"]}
    create: {name: "<gold>New order</gold>", lore: ["<gray>Pick an item and place a buy or sell order.</gray>"]}
    orders: {name: "<gold>My orders</gold>", lore: ["<gray>Your active orders; cancel them here.</gray>"]}
    history: {name: "<gold>History</gold>", lore: ["<gray>Your past trades.</gray>"]}
    mailbox: {name: "<gold>Mailbox</gold>", lore: ["<gray>Waiting for you: <yellow><count></yellow></gray>", "<gray>Bought items, earnings and refunds.</gray>"]}
    language: {name: "<gold>Language</gold>", lore: ["<gray>Current: <white><language></white></gray>"]}
    close: {name: "<red>Close</red>"}
    safe-mode: {name: "<red>Market paused for maintenance</red>", lore: ["<gray>Your money and items are safe.</gray>", "<gray>New orders and claims are paused.</gray>"]}
  browse:
    title: "<dark_gray>Market <search></dark_gray>"
    catalog: {name: "<gold>New order</gold>", lore: ["<gray>Pick any item from the catalog.</gray>"]}
    empty: {name: "<gray>No open orders yet.</gray>", lore: ["<gray>Be the first: <yellow>New order</yellow>.</gray>"]}
    entry:
      - "<gray>Lowest sell: <best-ask> <dark_gray>(<ask-qty> items)</dark_gray></gray>"
      - "<gray>Highest buy: <best-bid> <dark_gray>(<bid-qty> items)</dark_gray></gray>"
      - "<dark_gray><orders> orders</dark_gray>"
      - "<yellow>Click to open the order book.</yellow>"
  catalog:
    title: "<dark_gray>Catalog <search></dark_gray>"
    held-item: {name: "<gold>Item in your hand</gold>", lore: ["<gray>For items with special data:</gray>", "<gray>enchanted, renamed, potions…</gray>"]}
    empty: {name: "<gray>No item matches.</gray>"}
    entry: ["<yellow>Click to open the order book.</yellow>"]
  book:
    title: "<dark_gray>Order book: </dark_gray><item>"
    item:
      lore:
        - "<gray>Lowest sell: <best-ask></gray>"
        - "<gray>Highest buy: <best-bid></gray>"
    ask:
      name: "<red>Sell offer: <price></red>"
      lore: ["<gray><qty> items in <orders> order(s)</gray>", "<yellow>Click to buy at this price.</yellow>"]
    bid:
      name: "<green>Buy offer: <price></green>"
      lore: ["<gray><qty> items in <orders> order(s)</gray>", "<yellow>Click to sell at this price.</yellow>"]
    own:
      lore: ["<aqua><own> of these are yours (never matched with your own orders).</aqua>"]
    buy: {name: "<green>Place a buy order</green>", lore: ["<gray>Money is reserved until it fills or you cancel.</gray>"]}
    sell: {name: "<gold>Place a sell order</gold>", lore: ["<gray>Items are taken from your inventory until sold or cancelled.</gray>"]}
    empty: {name: "<gray>No orders for this item yet.</gray>", lore: ["<gray>Place the first one below.</gray>"]}
  create:
    title: "<dark_gray>New order: </dark_gray><item>"
    item:
      lore:
        - "<gray>Side: <side></gray>"
        - "<gray>Quantity: <yellow><qty></yellow></gray>"
        - "<gray>Unit price: <price></gray>"
        - "<gray>Total: <total></gray>"
    preview-loading: ["<dark_gray>Checking the book…</dark_gray>"]
    preview: ["<green><fill> of <qty> would trade right away for <cost>.</green>"]
    preview-none: ["<gray>Nothing would trade right away; the order waits in the book.</gray>"]
    own-cross: ["<aqua>Your own opposite order is in range; it is skipped.</aqua>"]
    owned: ["<gray>You have <yellow><owned></yellow> of this item.</gray>"]
    side: {name: "<white>Side: <side></white>", lore: ["<gray>Click to switch buy/sell.</gray>"]}
    qty-minus-64: {name: "<red>-64</red>"}
    qty-minus-10: {name: "<red>-10</red>"}
    qty-minus-1: {name: "<red>-1</red>"}
    qty-plus-1: {name: "<green>+1</green>"}
    qty-plus-10: {name: "<green>+10</green>"}
    qty-plus-64: {name: "<green>+64</green>"}
    qty-max: {name: "<yellow>Maximum</yellow>", lore: ["<gray>Sell: everything you have. Buy: the order limit.</gray>"]}
    qty-input: {name: "<yellow>Quantity: <qty></yellow>", lore: ["<gray>Click to type a quantity.</gray>"]}
    price-minus-10: {name: "<gold>Price -10</gold>"}
    price-minus-1: {name: "<gold>Price -1</gold>"}
    price-plus-1: {name: "<aqua>Price +1</aqua>"}
    price-plus-10: {name: "<aqua>Price +10</aqua>"}
    price-input: {name: "<yellow>Unit price: <price></yellow>", lore: ["<gray>Click to type a price.</gray>"]}
    confirm: {name: "<green>Continue</green>", lore: ["<gray>Total: <total></gray>"]}
  confirm:
    title: "<dark_gray>Confirm order</dark_gray>"
    summary:
      lore-buy:
        - "<gray>Buy <yellow><qty>×</yellow> at <price> each.</gray>"
        - "<gray><total> is reserved now; the unused part comes back.</gray>"
      lore-sell:
        - "<gray>Sell <yellow><qty>×</yellow> at <price> each.</gray>"
        - "<gray>The items leave your inventory now.</gray>"
      fill: ["<green><fill> trade right away for <cost>.</green>"]
      own-cross: ["<aqua>Your own opposite order is in range and will be skipped.</aqua>"]
    confirm: {name: "<green>Place order</green>", lore: ["<gray><side> <qty>× at <price></gray>"]}
    cancel: {name: "<red>Back</red>"}
  orders:
    title: "<dark_gray>My orders</dark_gray>"
    shift-to-cancel: "<yellow>Shift-click an order to cancel it.</yellow>"
    empty: {name: "<gray>You have no active orders.</gray>"}
    entry:
      - "<gray>#<id> <side></gray>"
      - "<gray>Left: <yellow><remaining></yellow>/<qty> <dark_gray>(<percent>% filled)</dark_gray></gray>"
      - "<gray>Unit price: <price></gray>"
      - "<gray>Reserved: <reserved></gray>"
      - "<red>Shift-click to cancel.</red>"
  history:
    title: "<dark_gray>History</dark_gray>"
    empty: {name: "<gray>No trades yet.</gray>"}
    filter: {name: "<yellow>Showing: <filter></yellow>", lore: ["<gray>Click to change.</gray>"]}
    filters:
      all: "all"
      bought: "bought"
      sold: "sold"
    entry-bought:
      - "<aqua>Bought</aqua> <yellow><qty>×</yellow> <gray>at</gray> <price>"
      - "<gray>Total: <total></gray>"
      - "<dark_gray><time></dark_gray>"
    entry-sold:
      - "<light_purple>Sold</light_purple> <yellow><qty>×</yellow> <gray>at</gray> <price>"
      - "<gray>Total: <total></gray>"
      - "<dark_gray><time></dark_gray>"
  mailbox:
    title: "<dark_gray>Mailbox</dark_gray>"
    empty: {name: "<gray>Your mailbox is empty.</gray>"}
    claim-all: {name: "<green>Collect all</green>", lore: ["<gray><count> entries</gray>"]}
    money:
      name: "<gold><amount></gold>"
      lore: ["<gray><reason></gray>", "<yellow>Click to collect.</yellow>"]
    item:
      lore: ["<gray><qty>× · <reason></gray>", "<yellow>Click to collect.</yellow>"]
    review:
      name: "<yellow>Under review</yellow>"
      lore: ["<gray>An admin is checking this entry (#<id>).</gray>", "<gray>Nothing will be paid twice.</gray>"]
  language:
    title: "<dark_gray>Language</dark_gray>"
    current:
      lore: ["<green>Selected</green>"]
    other:
      lore: ["<yellow>Click to select.</yellow>"]
